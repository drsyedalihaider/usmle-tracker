<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#ffffff">
  <title>App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    input[type="date"], input[type="number"], input[type="text"], select {
      border: 1px solid #d1d5db; border-radius: 8px; padding: 10px 12px; font-size: 16px; outline: none; background: inherit; color: inherit; width: 100%;
    }
    .dark input, .dark select { border-color: #4b5563; background: #374151; color: #f3f4f6; }
    input:focus, select:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
    .score-high { background: #dcfce7; color: #166534; }
    .score-mid { background: #fef9c3; color: #854d0e; }
    .score-low { background: #fee2e2; color: #991b1b; }
    .dark .score-high { background: #166534; color: #dcfce7; }
    .dark .score-mid { background: #854d0e; color: #fef9c3; }
    .dark .score-low { background: #991b1b; color: #fee2e2; }
    .heatmap-wrapper { overflow-x: auto; width: 100%; }
    .heatmap-grid { display: flex; gap: 4px; padding: 4px 0; justify-content: space-between; width: 100%; }
    .heatmap-week { display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .heatmap-cell { width: 100%; aspect-ratio: 1; border-radius: 2px; min-width: 8px; max-width: 16px; }
    @media (max-width: 768px) { .heatmap-cell { max-width: 12px; } }
    .donut-container { position: relative; }
    .donut-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
    .sync-indicator { animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .bottom-nav { padding-bottom: env(safe-area-inset-bottom); }
  </style>
</head>
<body class="bg-white dark:bg-gray-900">

  <!-- Login Screen -->
  <div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
    <div class="flex flex-col gap-3 w-64">
      <input type="password" id="key-input" placeholder="type" class="text-center" onkeypress="if(event.key==='Enter')tryLogin()">
      <div class="flex gap-2">
        <button onclick="tryLogin()" class="flex-1 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700">OK</button>
        <button onclick="document.getElementById('key-input').value=''" class="flex-1 py-2 bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-lg text-sm font-medium hover:bg-gray-300 dark:hover:bg-gray-600">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Main App -->
  <div id="app" class="hidden">
    <!-- Exam Date Modal -->
    <div id="exam-modal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4 hidden">
      <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 w-full max-w-sm shadow-xl">
        <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-4">Set Exam Date</h3>
        <input type="date" id="exam-date-input" class="mb-4">
        <div class="flex gap-3">
          <button onclick="saveExamDate()" class="flex-1 px-4 py-3 bg-blue-600 text-white rounded-xl font-medium">Save</button>
          <button onclick="hideModal('exam-modal')" class="flex-1 px-4 py-3 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-xl font-medium">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Day Edit Modal -->
    <div id="day-modal" class="fixed inset-0 bg-black/50 flex items-end sm:items-center justify-center z-50 hidden">
      <div class="bg-white dark:bg-gray-800 rounded-t-3xl sm:rounded-2xl p-6 w-full sm:max-w-md shadow-xl max-h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-lg font-semibold text-gray-900 dark:text-white" id="day-modal-title">Edit Day</h3>
          <button onclick="hideModal('day-modal')" class="p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg">
            <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="space-y-4">
          <div class="grid grid-cols-2 gap-4">
            <div class="bg-blue-50 dark:bg-blue-900/30 rounded-lg p-3">
              <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">Questions (from blocks)</label>
              <p class="text-xl font-bold text-blue-600 dark:text-blue-400" id="day-questions-display">0</p>
            </div>
            <div class="bg-rose-50 dark:bg-rose-900/30 rounded-lg p-3">
              <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">🍅 Pomodoros</label>
              <p class="text-xl font-bold" id="day-pomodoros-display">—</p>
            </div>
          </div>
          <div>
            <label class="block text-sm text-gray-600 dark:text-gray-400 mb-1">Notes</label>
            <textarea id="day-notes" rows="3" placeholder="Study notes, topics covered..." class="w-full border border-gray-300 dark:border-gray-600 rounded-lg p-3 text-sm bg-inherit text-inherit resize-none"></textarea>
          </div>
        </div>
        <button onclick="saveDayModal()" class="w-full mt-6 px-4 py-3 bg-blue-600 text-white rounded-xl font-medium hover:bg-blue-700">Save</button>
      </div>
    </div>

    <!-- Block Edit Modal -->
    <div id="block-modal" class="fixed inset-0 bg-black/50 flex items-end sm:items-center justify-center z-50 hidden">
      <div class="bg-white dark:bg-gray-800 rounded-t-3xl sm:rounded-2xl p-6 w-full sm:max-w-md shadow-xl max-h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-lg font-semibold text-gray-900 dark:text-white">Log Block <span id="modal-block-num"></span></h3>
          <button onclick="hideModal('block-modal')" class="p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg">
            <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="space-y-4">
          <div><label class="block text-sm text-gray-600 dark:text-gray-400 mb-1">Date</label><input type="date" id="modal-date"></div>
          <div class="grid grid-cols-2 gap-4">
            <div><label class="block text-sm text-gray-600 dark:text-gray-400 mb-1">Correct</label><input type="number" id="modal-correct" placeholder="32" min="0"></div>
            <div><label class="block text-sm text-gray-600 dark:text-gray-400 mb-1">Total</label><input type="number" id="modal-total" value="40" min="1"></div>
          </div>
          <div><label class="block text-sm text-gray-600 dark:text-gray-400 mb-1">Time (hours)</label><input type="number" id="modal-hours" placeholder="1.5" min="0" step="0.5"></div>
          <div><label class="block text-sm text-gray-600 dark:text-gray-400 mb-1">Notes</label><input type="text" id="modal-notes" placeholder="Weak areas..."></div>
        </div>
        <button onclick="saveBlockModal()" class="w-full mt-6 px-4 py-3 bg-blue-600 text-white rounded-xl font-medium hover:bg-blue-700">Save Block</button>
      </div>
    </div>

    <!-- Desktop Layout -->
    <div class="hidden md:flex min-h-screen">
      <div class="w-64 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 p-6 flex flex-col fixed h-full overflow-y-auto">
        <div class="mb-4 flex items-center justify-between">
          <div>
            <h1 class="text-xl font-bold text-gray-900 dark:text-white">USMLE Step 3</h1>
            <p class="text-sm text-gray-500 dark:text-gray-400">Study Tracker</p>
          </div>
          <button onclick="toggleDarkMode()" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">
            <svg class="w-5 h-5 text-gray-600 dark:text-gray-300 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
            <svg class="w-5 h-5 text-gray-600 dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
          </button>
        </div>
        <div id="sync-status-d" class="mb-4 px-3 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 text-xs flex items-center gap-2">
          <div class="w-2 h-2 rounded-full bg-green-500" id="sync-dot-d"></div>
          <span class="text-gray-600 dark:text-gray-400" id="sync-text-d">Synced</span>
        </div>

        <div class="mb-6 p-4 bg-gradient-to-br from-red-50 to-orange-50 dark:from-red-900/30 dark:to-orange-900/30 rounded-xl cursor-pointer" onclick="showModal('exam-modal')">
          <p class="text-xs font-semibold text-red-600 dark:text-red-400 uppercase">Exam Day</p>
          <p class="text-3xl font-bold text-gray-900 dark:text-white" id="countdown-d">--</p>
          <p class="text-sm text-gray-600 dark:text-gray-300">days remaining</p>
          <p class="text-xs text-gray-500 dark:text-gray-400 mt-1" id="exam-date-d">Tap to set</p>
        </div>

        <nav class="space-y-2 flex-1" id="desktop-nav"></nav>

        <div class="pt-4 border-t border-gray-200 dark:border-gray-700 mb-4">
          <div class="bg-gradient-to-br from-blue-50 to-indigo-50 dark:from-blue-900/30 dark:to-indigo-900/30 rounded-xl p-4">
            <p class="text-sm font-medium text-gray-700 dark:text-gray-300">Progress</p>
            <p class="text-2xl font-bold text-blue-600 dark:text-blue-400" id="sidebar-progress">0%</p>
            <div class="mt-2 h-2 bg-white dark:bg-gray-700 rounded-full overflow-hidden">
              <div class="h-full bg-blue-600 rounded-full" id="sidebar-bar" style="width:0%"></div>
            </div>
            <p class="text-xs text-gray-500 dark:text-gray-400 mt-2" id="sidebar-blocks">0 / 164 blocks</p>
          </div>
        </div>

        <!-- Pomodoro Timer & Stats -->
        <div class="pt-4 border-t border-gray-200 dark:border-gray-700">
          <div class="p-4 bg-gradient-to-br from-rose-50 to-red-50 dark:from-rose-900/30 dark:to-red-900/30 rounded-xl">
            <div class="flex items-center justify-between mb-2">
              <p class="text-xs font-semibold text-rose-600 dark:text-rose-400 uppercase">🍅 Pomodoro</p>
              <span id="timer-status-d" class="text-xs text-gray-500 dark:text-gray-400"></span>
            </div>
            <p class="text-3xl font-bold text-gray-900 dark:text-white text-center mb-3" id="timer-display-d">25:00</p>

            <!-- Timer controls -->
            <div id="timer-controls-d">
              <div class="flex gap-2 mb-2" id="timer-start-row-d">
                <select id="timer-duration-d" class="flex-1 text-sm py-2" onchange="setTimerDuration(this.value)">
                  <option value="25">25 min</option>
                  <option value="30">30 min</option>
                  <option value="45">45 min</option>
                  <option value="50">50 min</option>
                </select>
                <button onclick="startTimer()" class="flex-1 py-2 bg-rose-500 text-white rounded-lg text-sm font-medium hover:bg-rose-600">Start</button>
              </div>
              <div class="hidden gap-2" id="timer-running-row-d">
                <button onclick="pauseTimer()" id="pause-btn-d" class="flex-1 py-2 bg-yellow-500 text-white rounded-lg text-sm font-medium hover:bg-yellow-600">Pause</button>
                <button onclick="stopTimer()" class="flex-1 py-2 bg-gray-500 text-white rounded-lg text-sm font-medium hover:bg-gray-600">Stop</button>
              </div>
            </div>

            <!-- Pomodoro Stats -->
            <div class="mt-3 pt-3 border-t border-rose-200 dark:border-rose-800 text-xs space-y-1">
              <div class="flex justify-between"><span class="text-gray-500 dark:text-gray-400">Today</span><span class="font-medium text-gray-700 dark:text-gray-300" id="pomo-today-d">0h 0m</span></div>
              <div class="flex justify-between"><span class="text-gray-500 dark:text-gray-400">This Week</span><span class="font-medium text-gray-700 dark:text-gray-300" id="pomo-week-d">0h 0m</span></div>
              <div class="flex justify-between"><span class="text-gray-500 dark:text-gray-400">This Month</span><span class="font-medium text-gray-700 dark:text-gray-300" id="pomo-month-d">0h 0m</span></div>
              <div class="flex justify-between"><span class="text-gray-500 dark:text-gray-400">All Time</span><span class="font-medium text-gray-700 dark:text-gray-300" id="pomo-all-d">0h 0m</span></div>
            </div>
          </div>
        </div>
      </div>
      <div class="flex-1 ml-64 p-8 min-h-screen bg-gray-50 dark:bg-gray-900" id="main-content"></div>
    </div>

    <!-- Mobile Layout -->
    <div class="md:hidden flex flex-col min-h-screen">
      <div class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 px-4 py-3 flex items-center justify-between sticky top-0 z-40">
        <div>
          <h1 class="text-lg font-bold text-gray-900 dark:text-white">USMLE Step 3</h1>
          <div class="flex items-center gap-2 text-xs">
            <div class="w-2 h-2 rounded-full bg-green-500" id="sync-dot-m"></div>
            <span class="text-gray-500 dark:text-gray-400" id="sync-text-m">Synced</span>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <div class="text-right cursor-pointer" onclick="showModal('exam-modal')">
            <p class="text-2xl font-bold text-red-600 dark:text-red-400" id="countdown-m">--</p>
            <p class="text-xs text-gray-500">days left</p>
          </div>
          <button onclick="toggleDarkMode()" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">
            <svg class="w-5 h-5 text-gray-600 dark:text-gray-300 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
            <svg class="w-5 h-5 text-gray-600 dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
          </button>
        </div>
      </div>
      <div class="flex-1 p-4 pb-24 overflow-auto bg-gray-50 dark:bg-gray-900" id="mobile-content"></div>
      <div class="fixed bottom-0 left-0 right-0 bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 bottom-nav z-40" id="mobile-nav"></div>
    </div>
  </div>

  <script>
    const QBANKS = [
      { id: 'uworld', name: 'UWorld', blocks: 60, color: '#3B82F6' },
      { id: 'amboss', name: 'AMBOSS', blocks: 55, color: '#8B5CF6' },
      { id: 'nbme', name: 'NBME', blocks: 10, color: '#F59E0B' },
      { id: 'mehlman', name: 'Mehlman', blocks: 39, color: '#10B981' }
    ];
    const TOTAL_BLOCKS = 164, TOTAL_QS = 6518;

    let blocks = [], settings = { dailyQs: 80, dailyHours: 4 }, examDate = '', pomodoros = [], dailyNotes = [];
    let apiKey = localStorage.getItem('usmle-api-key') || '';
    let binId = localStorage.getItem('usmle-bin-id') || '';
    let darkMode = localStorage.getItem('usmle-dark') === 'true';
    let currentFilter = 'all', currentDate = new Date(), currentBlockId = null, currentTab = 'dashboard', currentDayKey = null;
    let scoreChart, dailyChart, qsDonut, scoreDonut, qbankDonuts = [];

    // Timer state
    let timerInterval = null;
    let timerSeconds = 25 * 60;
    let timerDuration = 25;
    let timerElapsed = 0; // Track elapsed time
    let isBreak = false;
    let isRunning = false;
    let isPaused = false;

    if (darkMode) document.documentElement.classList.add('dark');

    // Check if already logged in
    if (apiKey && binId) {
      initApp();
    }

    async function initApp() {
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      await loadFromCloud();
    }

    // Audio context for timer ring
    let audioCtx = null;
    function playRing() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      for (let i = 0; i < 3; i++) {
        setTimeout(() => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.frequency.value = i === 2 ? 1000 : 800;
          osc.type = 'sine';
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
          osc.start(audioCtx.currentTime);
          osc.stop(audioCtx.currentTime + 0.5);
        }, i * 600);
      }
    }

    function setTimerDuration(mins) {
      if (isRunning) return;
      timerDuration = parseInt(mins);
      timerSeconds = timerDuration * 60;
      updateTimerDisplay();
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function formatDuration(minutes) {
      const h = Math.floor(minutes / 60);
      const m = minutes % 60;
      return `${h}h ${m}m`;
    }

    function updateTimerDisplay() {
      const display = formatTime(timerSeconds);
      const statusText = isBreak ? '☕ Break' : (isRunning ? (isPaused ? '⏸️ Paused' : '🍅 Focus') : '');

      ['d', 'm'].forEach(v => {
        const el = document.getElementById(`timer-display-${v}`);
        const statusEl = document.getElementById(`timer-status-${v}`);
        if (el) el.textContent = display;
        if (statusEl) statusEl.textContent = statusText;

        // Toggle button visibility
        const startRow = document.getElementById(`timer-start-row-${v}`);
        const runningRow = document.getElementById(`timer-running-row-${v}`);
        const pauseBtn = document.getElementById(`pause-btn-${v}`);

        if (startRow && runningRow) {
          if (isRunning) {
            startRow.classList.add('hidden');
            runningRow.classList.remove('hidden');
            runningRow.classList.add('flex');
          } else {
            startRow.classList.remove('hidden');
            runningRow.classList.add('hidden');
            runningRow.classList.remove('flex');
          }
        }
        if (pauseBtn) {
          pauseBtn.textContent = isPaused ? 'Resume' : 'Pause';
          pauseBtn.className = isPaused
            ? 'flex-1 py-2 bg-green-500 text-white rounded-lg text-sm font-medium hover:bg-green-600'
            : 'flex-1 py-2 bg-yellow-500 text-white rounded-lg text-sm font-medium hover:bg-yellow-600';
        }
      });
    }

    function startTimer() {
      isRunning = true;
      isPaused = false;
      isBreak = false;
      timerElapsed = 0;
      timerInterval = setInterval(timerTick, 1000);
      updateTimerDisplay();
    }

    function pauseTimer() {
      if (isPaused) {
        // Resume
        isPaused = false;
        timerInterval = setInterval(timerTick, 1000);
      } else {
        // Pause
        isPaused = true;
        clearInterval(timerInterval);
      }
      updateTimerDisplay();
    }

    function stopTimer() {
      clearInterval(timerInterval);

      // Check if we should count this session
      if (!isBreak && timerElapsed >= 5 * 60) {
        // Count partial pomodoro (elapsed time in minutes)
        const elapsedMins = Math.floor(timerElapsed / 60);
        addPomodoro(elapsedMins);
      }

      isRunning = false;
      isPaused = false;
      isBreak = false;
      timerElapsed = 0;
      timerSeconds = timerDuration * 60;
      updateTimerDisplay();
    }

    function timerTick() {
      timerSeconds--;
      if (!isBreak) timerElapsed++;

      updateTimerDisplay();

      if (timerSeconds <= 0) {
        playRing();
        if (!isBreak) {
          // Work session complete - add full pomodoro
          addPomodoro(timerDuration);
          // Start break
          isBreak = true;
          timerSeconds = 5 * 60;
          updateTimerDisplay();
        } else {
          // Break complete - reset
          clearInterval(timerInterval);
          isRunning = false;
          isPaused = false;
          isBreak = false;
          timerElapsed = 0;
          timerSeconds = timerDuration * 60;
          updateTimerDisplay();
        }
      }
    }

    function addPomodoro(minutes) {
      const today = new Date().toISOString().split('T')[0];
      pomodoros.push({ date: today, duration: minutes });
      saveData();
      updatePomodoroStats();
      refreshAll();
    }

    function getPomodoroStats() {
      const now = new Date();
      const today = now.toISOString().split('T')[0];

      // Get start of week (Sunday)
      const weekStart = new Date(now);
      weekStart.setDate(now.getDate() - now.getDay());
      weekStart.setHours(0, 0, 0, 0);

      // Get start of month
      const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);

      let todayMins = 0, weekMins = 0, monthMins = 0, allMins = 0;

      pomodoros.forEach(p => {
        const pDate = new Date(p.date);
        allMins += p.duration;

        if (p.date === today) todayMins += p.duration;
        if (pDate >= weekStart) weekMins += p.duration;
        if (pDate >= monthStart) monthMins += p.duration;
      });

      return { todayMins, weekMins, monthMins, allMins };
    }

    function getTodayPomodoros() {
      const today = new Date().toISOString().split('T')[0];
      return pomodoros.filter(p => p.date === today);
    }

    function getTodayPomodoroTime() {
      const todayPomos = getTodayPomodoros();
      const totalMins = todayPomos.reduce((sum, p) => sum + p.duration, 0);
      return totalMins;
    }

    function updatePomodoroStats() {
      const stats = getPomodoroStats();
      ['d', 'm'].forEach(v => {
        const todayEl = document.getElementById(`pomo-today-${v}`);
        const weekEl = document.getElementById(`pomo-week-${v}`);
        const monthEl = document.getElementById(`pomo-month-${v}`);

    async function tryLogin() {
      const key = document.getElementById('key-input').value.trim();
      if (!key) return;

      apiKey = key;
      localStorage.setItem('usmle-api-key', apiKey);

      updateSyncStatus('syncing');
      try {
        // Try to find existing bin
        const listRes = await fetch('https://api.jsonbin.io/v3/c/uncategorized/bins', { headers: { 'X-Master-Key': apiKey } });
        if (listRes.ok) {
          const bins = await listRes.json();
          console.log('Found bins:', bins);
          const existing = bins.find(b => b.snippetMeta && b.snippetMeta.name === 'usmle-tracker');
          if (existing) {
            binId = existing.id;
            localStorage.setItem('usmle-bin-id', binId);
            console.log('Found existing bin:', binId);
          }
        } else {
          console.log('Could not list bins, will create new one');
        }

        if (binId) {
          document.getElementById('login-screen').classList.add('hidden');
          document.getElementById('app').classList.remove('hidden');
          await loadFromCloud();
        } else {
          const res = await fetch('https://api.jsonbin.io/v3/b', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Master-Key': apiKey, 'X-Bin-Name': 'usmle-tracker' },
            body: JSON.stringify({ blocks: [], settings, examDate: '', pomodoros: [], dailyNotes: [] })
          });
          if (res.ok) {
            binId = (await res.json()).metadata.id;
            localStorage.setItem('usmle-bin-id', binId);
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            updateSyncStatus('synced');
            updatePomodoroStats();
            refreshAll();
          } else {
            throw new Error('Failed to create bin');
          }
        }
      } catch (e) {
        document.getElementById('key-input').value = '';
        document.getElementById('key-input').placeholder = 'invalid';
        setTimeout(() => { document.getElementById('key-input').placeholder = 'type'; }, 2000);
      }
    }

    async function loadFromCloud() {
      if (!apiKey || !binId) return;
      updateSyncStatus('syncing');
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, { headers: { 'X-Master-Key': apiKey } });
        if (res.ok) {
          const d = await res.json();
          console.log('Loaded data:', d);
          if (d.record) {
            blocks = d.record.blocks || [];
            settings = d.record.settings || settings;
            examDate = d.record.examDate || '';
            pomodoros = d.record.pomodoros || [];
            dailyNotes = d.record.dailyNotes || [];
            console.log('Parsed - blocks:', blocks.length, 'examDate:', examDate);
          }
          updateSyncStatus('synced');
        } else {
          console.error('Load failed:', res.status, res.statusText);
          updateSyncStatus('error');
        }
        updatePomodoroStats();
        refreshAll();
      } catch (e) {
        console.error('Load error:', e);
        updateSyncStatus('error');
      }
    }

    async function syncToCloud() {
      if (!apiKey || !binId) return;
      updateSyncStatus('syncing');
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'X-Master-Key': apiKey },
          body: JSON.stringify({ blocks, settings, examDate, pomodoros, dailyNotes, lastSync: new Date().toISOString() })
        });
        if (res.ok) {
          console.log('Saved to cloud - blocks:', blocks.length, 'examDate:', examDate);
          updateSyncStatus('synced');
        } else {
          console.error('Save failed:', res.status, res.statusText);
          updateSyncStatus('error');
        }
      } catch (e) {
        console.error('Save error:', e);
        updateSyncStatus('error');
      }
    }

    function getWeakAreasList() {
      const weakAreas = blocks.filter(b => b.completed && b.notes && b.notes.trim() !== '')
        .sort((a, b) => new Date(b.date) - new Date(a.date)); // Most recent first

      if (weakAreas.length === 0) {
        return '<p class="text-sm text-gray-400 dark:text-gray-500 italic">No weak areas logged yet. Add notes when completing blocks to track areas for review.</p>';
      }

      return weakAreas.map(b => {
        const qbank = QBANKS.find(q => b.id.startsWith(q.id));
        const blockNum = b.id.split('-')[1];
        const score = ((b.correct / (b.total || 40)) * 100).toFixed(0);
        const scoreClass = score >= 80 ? 'text-green-600 dark:text-green-400' : score >= 60 ? 'text-yellow-600 dark:text-yellow-400' : 'text-red-600 dark:text-red-400';
        return `<div class="flex items-start gap-3 p-2 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700/50">
          <div class="w-8 h-8 rounded-lg flex items-center justify-center text-white text-xs font-bold flex-shrink-0" style="background:${qbank?.color || '#666'}">${blockNum}</div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2">
              <span class="text-xs font-medium text-gray-700 dark:text-gray-300">${qbank?.name || 'Block'} #${blockNum}</span>
              <span class="text-xs ${scoreClass}">${score}%</span>
              <span class="text-xs text-gray-400">${new Date(b.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</span>
            </div>
            <p class="text-sm text-gray-600 dark:text-gray-400 mt-0.5">${b.notes}</p>

      }).join('');
    }

    function getStats() {
      const completed = blocks.filter(b => b.completed);
      const totalQs = completed.reduce((s, b) => s + (b.total || 40), 0);
      const totalCorrect = completed.reduce((s, b) => s + (b.correct || 0), 0);
      const totalHours = completed.reduce((s, b) => s + (b.hours || 0), 0);
      const avgScore = totalQs > 0 ? (totalCorrect / totalQs * 100) : 0;
      let streak = 0;
      const today = new Date(); today.setHours(0,0,0,0);
      for (let i = 0; i < 365; i++) { const d = new Date(today); d.setDate(d.getDate() - i); if (completed.some(b => b.date === d.toISOString().split('T')[0])) streak++; else if (i > 0) break; }
      const todayKey = new Date().toISOString().split('T')[0];
      const todayBlocks = completed.filter(b => b.date === todayKey);
      const todayQs = todayBlocks.reduce((s, b) => s + (b.total || 40), 0);
      const todayHours = todayBlocks.reduce((s, b) => s + (b.hours || 0), 0);
      const qbankStats = QBANKS.map(qb => { const qbB = completed.filter(b => b.id.startsWith(qb.id)); const c = qbB.reduce((s, b) => s + (b.correct || 0), 0), t = qbB.reduce((s, b) => s + (b.total || 40), 0); return { ...qb, completed: qbB.length, qsDone: t, qsTotal: qb.blocks * 40, score: t > 0 ? (c / t * 100) : 0 }; });
      return { completedBlocks: completed.length, totalQs, totalCorrect, totalHours, avgScore, streak, todayQs, todayHours, qbankStats };
    }

    function generateHeatmapHTML() {
      const today = new Date(), oneYearAgo = new Date(today);
      oneYearAgo.setFullYear(oneYearAgo.getFullYear() - 1);
      const dateMap = {};
      blocks.filter(b => b.completed).forEach(b => { dateMap[b.date] = (dateMap[b.date] || 0) + (b.total || 40); });
      const maxQs = Math.max(...Object.values(dateMap), 40);

      let weeks = [], week = [], total = 0;
      const startPad = oneYearAgo.getDay();
      for (let i = 0; i < startPad; i++) week.push(null);

      for (let d = new Date(oneYearAgo); d <= today; d.setDate(d.getDate() + 1)) {
        const key = d.toISOString().split('T')[0];
        const qs = dateMap[key] || 0;
        total += qs;
        week.push({ date: key, qs, intensity: qs / maxQs });
        if (week.length === 7) { weeks.push(week); week = []; }
      }
      if (week.length) { while (week.length < 7) week.push(null); weeks.push(week); }

      const getColor = (cell) => {
        if (!cell || cell.qs === 0) return 'bg-gray-200 dark:bg-gray-700';
        if (cell.intensity > 0.75) return 'bg-green-600 dark:bg-green-400';
        if (cell.intensity > 0.5) return 'bg-green-500 dark:bg-green-500';
        if (cell.intensity > 0.25) return 'bg-green-400 dark:bg-green-600';
        return 'bg-green-300 dark:bg-green-800';
      };

      const html = `<div class="heatmap-grid">${weeks.map(w => `<div class="heatmap-week">${w.map(cell => `<div class="heatmap-cell ${getColor(cell)}" title="${cell ? cell.date + ': ' + cell.qs + ' Qs' : ''}"></div>`).join('')}</div>`).join('')}</div>`;
      return { html, total };
    }

            <div class="bg-white dark:bg-gray-800 rounded-2xl p-4 md:p-6 shadow-sm border border-gray-100 dark:border-gray-700"><h3 class="text-base font-semibold text-gray-900 dark:text-white mb-4">Score Trend</h3><canvas id="scoreChart" height="200"></canvas></div>
            <div class="bg-white dark:bg-gray-800 rounded-2xl p-4 md:p-6 shadow-sm border border-gray-100 dark:border-gray-700"><h3 class="text-base font-semibold text-gray-900 dark:text-white mb-4">Daily Questions</h3><canvas id="dailyChart" height="200"></canvas></div>
          </div>

          <div class="bg-white dark:bg-gray-800 rounded-2xl p-4 md:p-6 shadow-sm border border-gray-100 dark:border-gray-700">
            <h3 class="text-base md:text-lg font-semibold text-gray-900 dark:text-white mb-4">⚠️ Weak Areas</h3>
            <div class="space-y-2 max-h-64 overflow-y-auto" id="weak-areas-list">
              ${getWeakAreasList()}
            </div>
          </div>
        </div>

        <div id="tab-blocks" class="tab-content ${currentTab === 'blocks' ? 'active' : ''}">
          <div class="mb-4"><h2 class="text-xl md:text-2xl font-bold text-gray-900 dark:text-white">Block Tracker</h2></div>
          <div class="flex gap-2 overflow-x-auto pb-3 mb-4 -mx-4 px-4">
            <button onclick="setFilter('all')" class="px-3 py-1.5 rounded-lg text-sm font-medium whitespace-nowrap ${currentFilter === 'all' ? 'bg-gray-700 text-white' : 'bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300'}">All</button>
            ${QBANKS.map(qb => `<button onclick="setFilter('${qb.id}')" class="px-3 py-1.5 rounded-lg text-sm font-medium whitespace-nowrap" style="${currentFilter === qb.id ? 'background:' + qb.color + ';color:white' : ''}">${qb.name}</button>`).join('')}
          </div>
          <div class="space-y-2" id="blocks-list"></div>
        </div>

        <div id="tab-calendar" class="tab-content ${currentTab === 'calendar' ? 'active' : ''}">
          <div class="mb-4"><h2 class="text-xl md:text-2xl font-bold text-gray-900 dark:text-white">Calendar</h2></div>
          <div class="bg-white dark:bg-gray-800 rounded-2xl p-4 md:p-6 shadow-sm border border-gray-100 dark:border-gray-700">
            <div class="flex items-center justify-between mb-4">
              <button onclick="prevMonth()" class="p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg"><svg class="w-5 h-5 text-gray-600 dark:text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg></button>
              <h3 class="text-lg font-semibold text-gray-900 dark:text-white" id="cal-month"></h3>
              <button onclick="nextMonth()" class="p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg"><svg class="w-5 h-5 text-gray-600 dark:text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg></button>
            </div>
            <div class="grid grid-cols-7 gap-1 text-center text-xs font-medium text-gray-500 dark:text-gray-400 mb-2"><div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div></div>
            <div class="grid grid-cols-7 gap-1" id="cal-grid"></div>
          </div>
        </div>

        <div id="tab-settings" class="tab-content ${currentTab === 'settings' ? 'active' : ''}">
          <div class="mb-6"><h2 class="text-xl md:text-2xl font-bold text-gray-900 dark:text-white">Settings</h2></div>
          <div class="space-y-4">
            <div class="bg-white dark:bg-gray-800 rounded-xl p-4 shadow-sm border border-gray-100 dark:border-gray-700">
              <h3 class="font-semibold text-gray-900 dark:text-white mb-3">Daily Goals</h3>
              <div class="grid grid-cols-2 gap-4">
                <div><label class="text-sm text-gray-600 dark:text-gray-400">Questions/day</label><input type="number" id="set-daily-qs" value="${settings.dailyQs}" onchange="updateSettings()" class="mt-1"></div>
                <div><label class="text-sm text-gray-600 dark:text-gray-400">Hours/day</label><input type="number" id="set-daily-hours" value="${settings.dailyHours}" onchange="updateSettings()" class="mt-1"></div>
              </div>
            </div>
            <div class="bg-white dark:bg-gray-800 rounded-xl p-4 shadow-sm border border-gray-100 dark:border-gray-700">
              <h3 class="font-semibold text-gray-900 dark:text-white mb-3">Sync</h3>
              <div class="flex gap-3">
                <button onclick="forceRefresh()" class="flex-1 py-2 px-4 bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 rounded-lg text-sm font-medium">🔄 Force Refresh</button>
                <button onclick="forceSave()" class="flex-1 py-2 px-4 bg-green-100 dark:bg-green-900/30 text-green-700 dark:text-green-300 rounded-lg text-sm font-medium">💾 Force Save</button>
              </div>
              <p class="text-xs text-gray-500 mt-2">Bin ID: <code class="bg-gray-100 dark:bg-gray-700 px-1 rounded">${binId ? binId.substring(0, 12) + '...' : 'none'}</code></p>
            </div>
            <div class="bg-white dark:bg-gray-800 rounded-xl p-4 shadow-sm border border-gray-100 dark:border-gray-700">
              <h3 class="font-semibold text-gray-900 dark:text-white mb-3">Backup</h3>
              <div class="flex gap-3">
                <button onclick="exportData()" class="flex-1 py-2 px-4 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-lg text-sm font-medium">Export</button>
                <label class="flex-1 py-2 px-4 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-lg text-sm font-medium text-center cursor-pointer">Import<input type="file" accept=".json" onchange="importData(event)" class="hidden"></label>
              </div>
            </div>
            <div class="bg-white dark:bg-gray-800 rounded-xl p-4 shadow-sm border border-gray-100 dark:border-gray-700">
              <button onclick="logout()" class="w-full py-2 px-4 bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 rounded-lg text-sm font-medium">Logout</button>
            </div>
          </div>
        </div>
      `;

      document.getElementById('main-content').innerHTML = content;
      document.getElementById('mobile-content').innerHTML = content;
      setTimeout(() => {
        renderDonutCharts();
        updateCharts();
        renderBlocksList();
        renderCalendar();
        updateTimerDisplay();
        updatePomodoroStats();
      }, 50);
    }

    function renderDonutCharts() {
      const stats = getStats();
      const bg = darkMode ? '#374151' : '#e5e7eb';
      if (qsDonut) qsDonut.destroy();
      if (scoreDonut) scoreDonut.destroy();
      const qsCtx = document.getElementById('qsDonutChart');
      const scoreCtx = document.getElementById('scoreDonutChart');
      if (qsCtx) qsDonut = new Chart(qsCtx, { type: 'doughnut', data: { datasets: [{ data: [stats.totalQs, Math.max(0, TOTAL_QS - stats.totalQs)], backgroundColor: ['#3B82F6', bg], borderWidth: 0 }] }, options: { cutout: '75%', responsive: true, plugins: { legend: { display: false }, tooltip: { enabled: false } } } });
      if (scoreCtx) { const c = stats.avgScore >= 70 ? '#10B981' : stats.avgScore >= 60 ? '#F59E0B' : '#EF4444'; scoreDonut = new Chart(scoreCtx, { type: 'doughnut', data: { datasets: [{ data: [stats.avgScore, Math.max(0, 100 - stats.avgScore)], backgroundColor: [c, bg], borderWidth: 0 }] }, options: { cutout: '75%', responsive: true, plugins: { legend: { display: false }, tooltip: { enabled: false } } } }); }

      // Render qbank mini donuts
      qbankDonuts.forEach(d => d.destroy());
      qbankDonuts = [];
      stats.qbankStats.forEach((qb, i) => {
        const ctx = document.getElementById(`qbankDonut${i}`);
        if (ctx) {
          const c = qb.score >= 70 ? '#10B981' : qb.score >= 60 ? '#F59E0B' : '#EF4444';
          const chart = new Chart(ctx, {
            type: 'doughnut',
            data: { datasets: [{ data: [qb.score, Math.max(0, 100 - qb.score)], backgroundColor: [c, bg], borderWidth: 0 }] },
            options: { cutout: '70%', responsive: true, plugins: { legend: { display: false }, tooltip: { enabled: false } } }
          });
          qbankDonuts.push(chart);
        }
      });
    }

    function renderBlocksList() {
      const allBlocks = getAllBlocks();
      const filtered = currentFilter === 'all' ? allBlocks : allBlocks.filter(b => b.qbankId === currentFilter);
      document.querySelectorAll('#blocks-list').forEach(container => {
        container.innerHTML = filtered.map(b => {
          const score = b.completed ? ((b.correct / (b.total || 40)) * 100).toFixed(0) : null;
          const scoreClass = score >= 80 ? 'score-high' : score >= 60 ? 'score-mid' : 'score-low';
          return `<div class="bg-white dark:bg-gray-800 rounded-xl p-4 shadow-sm border border-gray-100 dark:border-gray-700 flex items-center gap-3 cursor-pointer active:scale-[0.99] transition-transform" onclick="openBlockModal('${b.id}')"><div class="w-10 h-10 rounded-lg flex items-center justify-center text-white text-sm font-bold flex-shrink-0" style="background:${b.color}">${b.number}</div><div class="flex-1 min-w-0"><div class="text-sm font-medium text-gray-900 dark:text-white">${b.qbankName} #${b.number}</div><div class="text-xs text-gray-500 dark:text-gray-400">${b.date ? new Date(b.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : 'Not completed'}</div></div>${score !== null ? `<div class="px-3 py-1 rounded-full text-xs font-semibold ${scoreClass}">${score}%</div>` : '<div class="text-xs text-gray-400">—</div>'}</div>`;
        }).join('');
      });
    }

    function setFilter(f) { currentFilter = f; renderContent(); }
    function openBlockModal(id) {
      const b = getAllBlocks().find(x => x.id === id);
      currentBlockId = id;
      document.getElementById('modal-block-num').textContent = b.number;
      document.getElementById('modal-date').value = b.date || new Date().toISOString().split('T')[0];
      document.getElementById('modal-correct').value = b.correct || '';
      document.getElementById('modal-total').value = b.total || 40;
      document.getElementById('modal-hours').value = b.hours || '';
      document.getElementById('modal-notes').value = b.notes || '';
      showModal('block-modal');
    }
    function saveBlockModal() {
      const data = { id: currentBlockId, date: document.getElementById('modal-date').value, correct: parseInt(document.getElementById('modal-correct').value) || 0, total: parseInt(document.getElementById('modal-total').value) || 40, hours: parseFloat(document.getElementById('modal-hours').value) || 0, notes: document.getElementById('modal-notes').value, completed: true };
      const idx = blocks.findIndex(b => b.id === currentBlockId);
      if (idx >= 0) blocks[idx] = data; else blocks.push(data);
      saveData(); hideModal('block-modal'); refreshAll();
    }

    function openDayModal(dateKey) {
      currentDayKey = dateKey;
      const dayData = dailyNotes.find(d => d.date === dateKey) || {};

      // Calculate questions from blocks
      const dayBlocks = blocks.filter(b => b.completed && b.date === dateKey);
      const dayQs = dayBlocks.reduce((sum, b) => sum + (b.total || 40), 0);

      // Calculate pomodoros
      const dayPomos = pomodoros.filter(p => p.date === dateKey);
      const pomoCount = dayPomos.length;
      const pomoDisplay = pomoCount > 0 ? '🍅'.repeat(Math.min(pomoCount, 10)) + (pomoCount > 10 ? `+${pomoCount - 10}` : '') : '—';

      document.getElementById('day-modal-title').textContent = new Date(dateKey).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
      document.getElementById('day-questions-display').textContent = dayQs > 0 ? dayQs : '0';
      document.getElementById('day-pomodoros-display').textContent = pomoDisplay;
      document.getElementById('day-notes').value = dayData.notes || '';
      showModal('day-modal');
    }

    function saveDayModal() {
      const notes = document.getElementById('day-notes').value.trim();

      const idx = dailyNotes.findIndex(d => d.date === currentDayKey);
      const data = { date: currentDayKey, notes };

      if (notes === '') {
        // Remove entry if empty
        if (idx >= 0) dailyNotes.splice(idx, 1);
      } else {
        if (idx >= 0) dailyNotes[idx] = data;
        else dailyNotes.push(data);
      }

      saveData();
      hideModal('day-modal');
      refreshAll();
    }

    function renderCalendar() {
      const year = currentDate.getFullYear(), month = currentDate.getMonth();
      const firstDay = new Date(year, month, 1).getDay(), daysInMonth = new Date(year, month + 1, 0).getDate(), today = new Date();

      // Build date map for questions from blocks
      const qsMap = {};
      blocks.filter(b => b.completed).forEach(b => { qsMap[b.date] = (qsMap[b.date] || 0) + (b.total || 40); });

      // Build date map for pomodoros
      const pomoMap = {};
      pomodoros.forEach(p => { pomoMap[p.date] = (pomoMap[p.date] || 0) + 1; });

      // Build notes map
      const notesMap = {};
      dailyNotes.forEach(d => { notesMap[d.date] = d; });

      let html = '';
      for (let i = 0; i < firstDay; i++) html += '<div class="aspect-square"></div>';
      for (let d = 1; d <= daysInMonth; d++) {
        const key = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const isToday = today.getDate() === d && today.getMonth() === month && today.getFullYear() === year;
        const dayNote = notesMap[key] || {};
        const dayQs = qsMap[key] || 0;
        const pomoCount = pomoMap[key] || 0;
        const hasData = dayQs > 0 || dayNote.notes || pomoCount > 0;

        // Question display (auto from blocks)
        const qDisplay = dayQs > 0 ? `Q:${dayQs}` : '';

        // Pomodoro display
        const pomoDisplay = pomoCount > 0 ? '🍅'.repeat(Math.min(pomoCount, 4)) + (pomoCount > 4 ? '+' : '') : '';

        // Notes display (truncated)
        const noteDisplay = dayNote.notes ? (dayNote.notes.length > 8 ? dayNote.notes.substring(0, 8) + '…' : dayNote.notes) : '';

        html += `<div onclick="openDayModal('${key}')" class="aspect-square rounded-lg flex flex-col items-start justify-start text-xs p-1 cursor-pointer hover:ring-2 hover:ring-blue-300 transition-all ${hasData ? 'bg-blue-50 dark:bg-blue-900/30' : 'bg-gray-50 dark:bg-gray-800'} ${isToday ? 'ring-2 ring-blue-500' : ''}">
          <span class="${isToday ? 'text-blue-600 font-bold' : 'text-gray-700 dark:text-gray-300'} text-[10px]">${d}</span>
          ${qDisplay ? `<span class="text-blue-600 dark:text-blue-400 text-[9px] font-medium">${qDisplay}</span>` : ''}
          ${pomoDisplay ? `<span class="text-[8px] leading-tight">${pomoDisplay}</span>` : ''}
          ${noteDisplay ? `<span class="text-gray-500 dark:text-gray-400 text-[8px] truncate w-full">${noteDisplay}</span>` : ''}
        </div>`;
      }
      document.querySelectorAll('#cal-grid').forEach(el => el.innerHTML = html);
      document.querySelectorAll('#cal-month').forEach(el => el.textContent = currentDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' }));
    }

    function prevMonth() { currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1); renderCalendar(); }
    function nextMonth() { currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1); renderCalendar(); }

    function updateCharts() {
      const textColor = darkMode ? '#9ca3af' : '#6b7280', gridColor = darkMode ? '#374151' : '#e5e7eb';
      const completed = blocks.filter(b => b.completed).sort((a, b) => new Date(a.date) - new Date(b.date));
      const scoreData = completed.slice(-15).map(b => ((b.correct / (b.total || 40)) * 100).toFixed(0)), scoreLabels = completed.slice(-15).map((_, i) => i + 1);
      const dailyMap = {}; completed.forEach(b => { dailyMap[b.date] = (dailyMap[b.date] || 0) + (b.total || 40); });
      const daily = Object.entries(dailyMap).sort((a, b) => new Date(a[0]) - new Date(b[0])).slice(-10);
      if (scoreChart) scoreChart.destroy(); if (dailyChart) dailyChart.destroy();
      const ctx1 = document.getElementById('scoreChart'), ctx2 = document.getElementById('dailyChart');
      if (ctx1) scoreChart = new Chart(ctx1, { type: 'line', data: { labels: scoreLabels, datasets: [{ data: scoreData, borderColor: '#3B82F6', backgroundColor: 'rgba(59,130,246,0.1)', fill: true, tension: 0.3 }] }, options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, max: 100, ticks: { color: textColor }, grid: { color: gridColor } }, x: { ticks: { color: textColor }, grid: { display: false } } } } });
      if (ctx2) dailyChart = new Chart(ctx2, { type: 'bar', data: { labels: daily.map(([d]) => new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })), datasets: [{ data: daily.map(([, v]) => v), backgroundColor: '#3B82F6', borderRadius: 4 }] }, options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { ticks: { color: textColor }, grid: { color: gridColor } }, x: { ticks: { color: textColor }, grid: { display: false } } } } });
    }

    function updateSettings() { settings.dailyQs = parseInt(document.getElementById('set-daily-qs')?.value) || 80; settings.dailyHours = parseInt(document.getElementById('set-daily-hours')?.value) || 4; saveData(); }
    function exportData() { const blob = new Blob([JSON.stringify({ blocks, settings, examDate, pomodoros, dailyNotes }, null, 2)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `backup-${new Date().toISOString().split('T')[0]}.json`; a.click(); }
    function importData(e) { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = (ev) => { try { const d = JSON.parse(ev.target.result); if (d.blocks) blocks = d.blocks; if (d.settings) settings = d.settings; if (d.examDate) examDate = d.examDate; if (d.pomodoros) pomodoros = d.pomodoros; if (d.dailyNotes) dailyNotes = d.dailyNotes; saveData(); refreshAll(); } catch { alert('Invalid file'); } }; r.readAsText(f); }

    async function forceRefresh() {
      alert('Refreshing data from cloud...');
      await loadFromCloud();
      alert('Data refreshed! Blocks: ' + blocks.length + ', Exam: ' + (examDate || 'not set'));
    }

    async function forceSave() {
      alert('Saving data to cloud...');
      await syncToCloud();
      alert('Data saved! Blocks: ' + blocks.length + ', Exam: ' + (examDate || 'not set'));
    }

    function logout() {
      localStorage.removeItem('usmle-api-key');
      localStorage.removeItem('usmle-bin-id');
      location.reload();
    }

    function showTab(tab) { currentTab = tab; renderNav(); renderContent(); }
    function refreshAll() { renderNav(); renderContent(); updateCountdown(); }
  </script>
</body>
</html>
